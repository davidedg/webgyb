name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Weekly, to catch newly published advisories
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # The server bundles its dependencies (astro.config.mjs) and the Docker
      # image ships without node_modules: check that the build runs that way
      - name: Smoke test without node_modules
        run: |
          rm -rf node_modules
          node scripts/smoke-test.mjs
